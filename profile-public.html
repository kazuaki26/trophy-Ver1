<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>トロフィーページ</title>
    <style id="dynamicStyles">
        body {
            padding: 30px;
            background: linear-gradient(to right, #e2e2e2, #c9d6ff);
            font-family: Arial, sans-serif;
            font-size: 16px;
            color: black;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
        }

        button {
            color: blueviolet;
            background-color: #c9d6ff;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        button:hover {
            text-decoration: underline;
            color: blue;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        div {
            font-size: 20px;
            padding: 10px;
            margin-bottom: 10px;
            width: 50%;
            text-align: center;
        }

        .edit-section,
        .trophy-room-section {
            display: none;
            margin-top: 20px;
            width: 60%;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            font-size: 16px;
        }

        .post {
            width: 180%;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            /* ボックス影 */
            margin-top: 10px;
            background-color: #f4f4f9;
        }

        .post h4 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .post-content {
            display: none;
            padding-top: 10px;
            width: 88%;
        }

        .widget {
            background-color: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            overflow: auto;
            width: 200px;
            height: 200px;
            position: relative;
        }

        .ui-draggable {
            cursor: move;
        }

        h2 {
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        p {
            font-size: 1.2rem;
        }

        #widget1 {
            background-color: #e0f7fa;
        }

        #widget2 {
            background-color: #fff3e0;
        }

        #widget3 {
            background-color: #ffe0ea;
        }

        #Widget1-flote {
            display: flex;
            /* 横並びにする */
            justify-content: space-between;
            /* 要素の間隔を均等に */
            align-items: center;
            /* 縦方向の中央揃え */
        }


        #profile-image-container {
            position: relative;
            width: 150px;
            height: 150px;
        }

        #profile-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        input[type="file"] {
            margin-top: 10px;
        }



        .available {
            background-color: #eee;
            /* 空き */
        }

        .reserved-by-user {
            background-color: #007bff;
            /* 自分の予約 */
        }

        .reserved-by-others {
            background-color: #dc3545;
            /* 他人の予約 */
        }


        .info {
            font-size: 0.8rem;
            margin-top: 10px;
            color: gray;
        }


        /* ハンバーガーメニューアイコンのスタイル */
        .hamburger-menu {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 30px;
            height: 1px;
            cursor: pointer;
            z-index: 10;
        }

        .hamburger-menu div {
            width: 100%;
            height: 1px;
            /* 線の太さをさらに細く */
            background-color: black;
            margin: 5px 0;
            /* 線同士の間隔 */
        }

        /* メニューのスタイル */
        .menu {
            position: fixed;
            top: 0;
            right: -300px;
            /* 初期状態では画面外に隠す */
            width: 250px;
            height: 100vh;
            background-color: white;
            transition: right 0.3s ease;
            z-index: 1001;
            box-shadow: -5px 0 5px rgba(0, 0, 0, 0.2);
        }

        .menu ul {
            list-style: none;
            padding: 0;
            margin-top: 60px;
        }

        .menu ul li {
            padding: 20px;
            text-align: center;
        }

        .menu ul li a {
            text-decoration: none;
            color: black;
            font-size: 18px;
        }

        /* 閉じるためのバツボタン */
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            cursor: pointer;
            color: black;
        }

        /* 背景を暗くするオーバーレイ */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 1000;
        }

        /* メニューが開いたときのスタイル */
        .menu-open .menu {
            right: 0;
        }

        .menu-open .overlay {
            opacity: 1;
            visibility: visible;
        }

        .tab-wrap {
            display: flex;
            flex-wrap: wrap;
            margin: 20px 0;
            width: 95%;

        }

        .tab-wrap:after {
            content: '';
            width: 100%;
            height: 3px;
            background: DeepSkyBlue;
            display: block;
            order: -1;
        }

        .tab-label {
            color: White;
            background: LightGray;
            font-weight: bold;
            text-shadow: 0 -1px 0 rgba(0, 0, 0, .2);
            white-space: nowrap;
            text-align: center;
            padding: 10px .5em;
            order: -1;
            position: relative;
            z-index: 1;
            cursor: pointer;
            border-radius: 5px 5px 0 0;
            flex: 1;
        }

        .tab-label:not(:last-of-type) {
            margin-right: 5px;
        }

        .tab-content {
            width: 100%;
            height: 0;
            overflow: hidden;
            opacity: 0;
        }

        /* アクティブなタブ */
        .tab-switch:checked+.tab-label {
            background: DeepSkyBlue;
        }

        .tab-switch:checked+.tab-label+.tab-content {
            height: auto;
            overflow: auto;
            padding: 15px;
            opacity: 1;
            transition: .5s opacity;
            box-shadow: 0 0 3px rgba(0, 0, 0, .2);
        }

        /* ラジオボタン非表示 */
        .tab-switch {
            display: none;
        }

        .tab-wrap div {
            font-size: 20px;
            padding: 10px;
            margin-bottom: 10px;
            width: 100%;
            text-align: center;
        }

        .profile {
    text-align: center;
}
img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
}
#editButton {
    display: none;
    margin-top: 10px;
}
    </style>
    <script type="module" src="./profile-public.js"></script>
</head>
<body>
    <div class="profile">
        <img id="profileImageUrl" alt="Profile Image">
        <h1 id="firstName"></h1>
        <button id="editButton">ページを編集</button>
    </div>

    <!-- Firebase App and Firestore will be initialized in a separate JS file -->
</body>
</html>
