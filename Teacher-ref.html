   /* ハンバーガーメニューアイコンのスタイル */
   .hamburger-menu {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 30px;
            height: 1px;
            cursor: pointer;
            z-index: 10;
        }

        .hamburger-menu div {
            width: 100%;
            height:8px; /* 線の太さをさらに細く */
            background-color: black;
            margin: 3px 0; /* 線同士の間隔 */
        }

        /* メニューのスタイル */
        .menu {
            position: fixed;
            top: 0;
            right: -300px; /* 初期状態では画面外に隠す */
            width: 250px;
            height: 100vh;
            background-color: white;
            transition: right 0.3s ease;
            z-index: 1001;
            box-shadow: -5px 0 5px rgba(0, 0, 0, 0.2);
        }

        .menu ul {
            list-style: none;
            padding: 0;
            margin-top: 60px;
        }

        .menu ul li {
            padding: 20px;
            text-align: center;
        }

        .menu ul li a {
            text-decoration: none;
            color: black;
            font-size: 18px;
        }

        /* 閉じるためのバツボタン */
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            cursor: pointer;
            color: black;
        }

        /* 背景を暗くするオーバーレイ */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 1000;
        }

        /* メニューが開いたときのスタイル */
        .menu-open .menu {
            right: 0;
        }

        .menu-open .overlay {
            opacity: 1;
            visibility: visible;
        }




        * {

body {

/*Styling Selectbox*/
.dropdown {
  width: 300px;
  display: inline-block;
  background-color: #fff;
  border-radius: 2px;
  box-shadow: 0 0 2px rgb(204, 204, 204);
  transition: all .5s ease;
  position: relative;
  font-size: 14px;
  color: #474747;
  height: 100%;
  text-align: left
}
.dropdown .select {
    cursor: pointer;
    display: block;
    padding: 10px
}
.dropdown .select > i {
    font-size: 13px;
    color: #888;
    cursor: pointer;
    transition: all .3s ease-in-out;
    float: right;
    line-height: 20px
}
.dropdown:hover {
    box-shadow: 0 0 4px rgb(204, 204, 204)
}
.dropdown:active {
    background-color: #f8f8f8
}
.dropdown.active:hover,
.dropdown.active {
    box-shadow: 0 0 4px rgb(204, 204, 204);
    border-radius: 2px 2px 0 0;
    background-color: #f8f8f8
}
.dropdown.active .select > i {
    transform: rotate(-90deg)
}
.dropdown .dropdown-menu {
    position: absolute;
    background-color: #fff;
    width: 100%;
    left: 0;
    margin-top: 1px;
    box-shadow: 0 1px 2px rgb(204, 204, 204);
    border-radius: 0 1px 2px 2px;
    overflow: hidden;
    display: none;
    max-height: 144px;
    overflow-y: auto;
    z-index: 9
}
.dropdown .dropdown-menu li {
    padding: 10px;
    transition: all .2s ease-in-out;
    cursor: pointer
} 
.dropdown .dropdown-menu {
    padding: 0;
    list-style: none
}
.dropdown .dropdown-menu li:hover {
    background-color: #f2f2f2
}
.dropdown .dropdown-menu li:active {
    background-color: #e2e2e2
}

.yokonarabi {

    padding-top: 10px;

}

    <div class="hamburger-menu" id="hamburger-menu">

    </div>

    <!-- オーバーレイ（背景を暗くする要素） -->

    <!-- メニューの中身 -->
    <nav class="menu" id="menu">
        <!-- 閉じるためのバツボタン -->
        <span class="close-btn" id="close-menu">&times;</span>

        <ul>
            <li><a href="homepage.html">Home</a></li>
            <li><a href="#">About</a></li>

        </ul>
    </nav>
    <script>
        const hamburgerMenu = document.getElementById('hamburger-menu');
        const menu = document.getElementById('menu');
        const overlay = document.getElementById('overlay');
        const closeMenu = document.getElementById('close-menu');
        let isMenuOpen = false;

        // ハンバーガーメニューのクリックイベント
        hamburgerMenu.addEventListener('click', () => {
            isMenuOpen = !isMenuOpen;
            toggleMenu();
        });

        // オーバーレイをクリックしてメニューを閉じる
        overlay.addEventListener('click', () => {
            isMenuOpen = false;
            toggleMenu();
        });

        // バツボタンをクリックしてメニューを閉じる
        closeMenu.addEventListener('click', () => {
            isMenuOpen = false;
            toggleMenu();
        });

        // メニューの開閉を制御
        function toggleMenu() {
            if (isMenuOpen) {
                document.body.classList.add('menu-open');
            } else {
                document.body.classList.remove('menu-open');
            }
        }
    </script>
