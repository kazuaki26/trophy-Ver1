<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生徒一覧</title>
    <style>
        ul {
            list-style: none;
            padding: 0;
            max-width: 600px;
            margin: 20px auto;
        }
        li {
            display: flex;
            align-items: center;
            padding: 10px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: background 0.3s;
        }
        li:hover {
            background: rgba(255, 255, 255, 1);
        }
        img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 10px;
        }
        body {
            padding: 30px;
            background: linear-gradient(to right, #e2e2e2, #c9d6ff);
            font-family: Arial, sans-serif;
            font-size: 20px;
            color: black;
        }
        .search-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 200px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        span {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>生徒一覧</h1>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="名前で検索">
        <input type="text" id="searchYear" placeholder="学年で検索 (例: 1年, 2年, 3年)">
        <input type="text" id="searchClass" placeholder="クラスで検索 (例: A, B, C)">
    </div>
    <ul id="studentList"></ul>
    <script src="top-public-page.js" type="module"></script>
</body>
</html>
