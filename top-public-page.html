<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生徒一覧</title>
    <style>
        body {
            padding: 30px;
            background: linear-gradient(to right, #1c4376, #1c4376);
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }
        h1 {
            margin-bottom: 20px;
        }
        .search-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-group {
            display: flex;
            gap: 5px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        input[type="text"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            outline: none;
            transition: border 0.3s;
        }
        input[type="text"]::placeholder {
            color: #ddd;
        }
        input[type="text"]:focus {
            border-color: #007bff;
        }
        .wide-input {
            width: 200px;
        }
        .small-input {
            width: 80px;
            text-align: center;
        }
        ul {
            list-style: none;
            padding: 0;
            max-width: 600px;
            margin: 20px auto;
        }
        li {
            display: flex; align-items: center; 
            
            padding: 15px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            transition: background 0.3s;
        }
        li:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 15px;
            border: 2px solid white;
        }
        span {
            align-items: center; 
            font-size: 18px;
            font-weight: bold;
        }
        strong {
            align-items: center; 
        }
        a {
            color: white;
            text-decoration: none;
            transition: color 0.3s;
        }
        a:hover {
            color: #ddd;
        }

         /* ハンバーガーメニューアイコンのスタイル */
        .hamburger-menu {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 35px;
            height: 25px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hamburger-menu div {
            width: 100%;
            height: 4px;
            background-color: white;
            border-radius: 2px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        /* メニューのスタイル */
        .menu {
            position: fixed;
            top: 0;
            right: -300px;
            width: 250px;
            height: 100vh;
            background-color: #1c4376;
            transition: right 0.3s ease;
            z-index: 1001;
            box-shadow: -5px 0 10px rgba(0, 0, 0, 0.5);
            color: white;
        }

        .menu ul {
            list-style: none;
            padding: 0;
            margin-top: 60px;
        }

        .menu ul li {
            margin: 10px 15px;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .menu ul li a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            transition: color 0.3s ease;
        }

        .menu ul li a:hover {
            color: #ffcc00;
        }

        /* 閉じるためのバツボタン */
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 24px;
            cursor: pointer;
            color: white;
        }

        /* 背景を暗くするオーバーレイ */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 1000;
        }

        /* メニューが開いたときのスタイル */
        .menu-open .menu {
            right: 0;
        }

        .menu-open .overlay {
            opacity: 1;
            visibility: visible;
        }

        @media (max-width: 600px) {
            input[type="text"] {
                width: 100%;
            }
            li {
                flex-direction: row;
                text-align: left;
            }
            img {
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
   <!-- ハンバーガーメニューアイコン -->
<div class="hamburger-menu" id="hamburger-menu">
    <div style="height: 8px; margin-bottom: 5px;"></div>
    <div style="height: 8px;"></div>
</div>

<!-- ログインボタン（デフォルトでは非表示）-->
<button id="login-button" style="display: none; position: absolute; right: 20px; top: 10px; padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer;">ログイン</button>

<!-- オーバーレイ（背景を暗くする要素） -->
<div class="overlay" id="overlay"></div>

<!-- メニューの中身 -->
<nav class="menu" id="menu" style="display: none;">
    <span class="close-btn" id="close-menu">&times;</span>
    <ul>
        <li><a href="homepage.html">Home</a></li>
        <li><a href="top-public-page.html">みんなのトロフィー</a></li>
        <li><a href="teacherControl.html">教員管理ページ</a></li>
        <li><a href="EditProfile.html">カスタマイズ画面</a></li>
        <li><button id="logout" style="color: white; background-color: #ff4b2b; padding: 10px 20px; border-radius: 8px; font-size: 1rem; font-weight: bold; border: none; cursor: pointer;">ログアウト</button></li>
    </ul>
</nav>


    <h1>生徒一覧</h1>
    <p>ここでは、生徒のプロフィールを検索・閲覧することができます。<br>
    スマートフォン等では、違うレイアウトで表示されます。あらかじめご了承ください。<br>
    なお、クラスでの検索には、学年・期生いずれかの情報が必要です。</p>
    <div class="search-container">
        <input type="text" id="searchInput" class="wide-input" placeholder="名前で検索(空白なし)">
        <div class="search-group">
            <input type="text" id="searchYear" class="small-input" placeholder="学年">
            <input type="text" id="searchClass" class="small-input" placeholder="クラス">
            <input type="text" id="searchTermYear" class="small-input" placeholder="期生">
        </div>
    </div>
    <ul id="studentList"></ul>
    <script src="top-public-page.js" type="module"></script>
</body>
</html>
